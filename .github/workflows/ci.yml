name: CI

on:
  push:
    branches:
      - main
      - "Task-*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: windows-latest
    env:
      CI: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"
      SOLUTION_PATH: sources/dotnet/AMDevIT.Admob.Wrapper
      PACKAGE_OUTPUT: artifacts/packages

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "17"

      - name: Restore .NET workloads
        shell: pwsh
        run: dotnet workload restore $env:SOLUTION_PATH

      - name: Restore solution
        shell: pwsh
        run: dotnet restore $env:SOLUTION_PATH

      - name: Read package version
        shell: pwsh
        run: |
          $project = "$env:SOLUTION_PATH/AMDevIT.Admob.Wrapper/AMDevIT.Admob.Wrapper.csproj"
          $version = (dotnet msbuild $project -getProperty:Version -nologo).Trim()

          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($version)) {
            throw "Could not read the package version from $project."
          }

          "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Run async lifecycle tests
        shell: pwsh
        run: >-
          dotnet run
          --project "$env:SOLUTION_PATH/AMDevIT.Admob.Wrapper.MAUICross.Tests/AMDevIT.Admob.Wrapper.MAUICross.Tests.csproj"
          --configuration Release
          --no-restore

      - name: Build solution
        shell: pwsh
        run: >-
          dotnet build $env:SOLUTION_PATH
          --configuration Release
          --no-restore
          --disable-build-servers

      - name: Pack release candidates
        shell: pwsh
        run: |
          $projects = @(
            "AMDevIT.Admob.Wrapper.Droid/AMDevIT.Admob.Wrapper.Droid.csproj",
            "AMDevIT.Admob.Wrapper.iOSNative/AMDevIT.Admob.Wrapper.iOSNative.csproj",
            "AMDevIT.Admob.Wrapper/AMDevIT.Admob.Wrapper.csproj",
            "AMDevIT.Admob.Wrapper.MAUICross/AMDevIT.Admob.Wrapper.MAUICross.csproj"
          )

          foreach ($project in $projects) {
            dotnet pack "$env:SOLUTION_PATH/$project" `
              --configuration Release `
              --no-build `
              --output $env:PACKAGE_OUTPUT

            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Verify package metadata and consumer restore
        shell: pwsh
        run: ./eng/verify-packages.ps1 -PackageDirectory $env:PACKAGE_OUTPUT -Version $env:PACKAGE_VERSION

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/packages/*.*nupkg
          if-no-files-found: error
